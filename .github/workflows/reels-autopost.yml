name: Instagram Reels 自動投稿

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 分ごとに予約キューを確認 (UTC 基準・数分遅れることがあります)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [queue.json]

concurrency:
  group: reels-autopost
  cancel-in-progress: false   # 二重投稿防止

permissions:
  contents: write             # queue.json の投稿結果をコミットするため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt && sudo apt-get install -y -qq ffmpeg

      - name: 予約投稿を実行
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
        run: python -m reels_poster run

      - name: 投稿結果をコミット
        if: always()
        run: |
          if git diff --quiet -- queue.json; then exit 0; fi
          git config user.name  "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add queue.json
          git commit -m "chore: 投稿結果を更新 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
